<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หมวดหมู่ - ห้องสมุดส่วนตัว</title>

    <link rel="apple-touch-icon" href="app-icon.png">
    <meta name="apple-mobile-web-app-title" content="ห้องสมุดส่วนตัว">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body {
            margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 100px;
        }

        .header { text-align: center; color: white; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
        
        /* สไตล์กระดิ่งแจ้งเตือน */
        .noti-wrapper { position: absolute; top: 0; right: 0; }
        .btn-bell { background: rgba(255,255,255,0.2); border: none; border-radius: 50%; padding: 10px; font-size: 20px; cursor: pointer; color: white; }
        .noti-badge { position: absolute; top: 0; right: 0; background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; display: none; }
        .noti-dropdown { position: absolute; top: 50px; right: 0; background: white; border-radius: 12px; width: 280px; max-height: 300px; overflow-y: auto; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: left; }
        .noti-item { padding: 12px; border-bottom: 1px solid #eee; color: #333; font-size: 12px; cursor: pointer; }
        .noti-item.unread { background: #f0f7ff; }

        .app-logo-container { width: 120px; height: 120px; margin-bottom: 15px; border-radius: 25px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.3); background: white; }
        .app-logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .category-card { background: white; border-radius: 20px; padding: 25px 10px; text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #333; min-height: 160px; }
        .category-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .category-card .icon { font-size: 40px; margin-bottom: 12px; }
        .category-card .name { font-weight: 600; font-size: 15px; color: #4a148c; line-height: 1.3; }
        
        .btn-logout-fixed { position: fixed; bottom: 20px; left: 20px; background: #e53e3e; color: white; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; }
        .btn-donate-fixed { position: fixed; bottom: 20px; right: 20px; background: #d4af37; color: #000; border: none; padding: 12px 18px; border-radius: 50px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <div class="header">
        <div class="noti-wrapper">
            <button class="btn-bell" onclick="toggleNotiDropdown()">🔔<span class="noti-badge" id="notiBadge">0</span></button>
            <div class="noti-dropdown" id="notiDropdown">
                <div style="padding:10px; font-weight:bold; border-bottom:1px solid #eee;">🔔 การแจ้งเตือน</div>
                <div id="notiBody"><div style="padding:20px; text-align:center; color:#999;">ไม่มีการแจ้งเตือน</div></div>
            </div>
        </div>
        <div class="app-logo-container">
            <img src="app-icon.png" alt="App Logo" onerror="this.parentElement.innerHTML='<h1 style=\'font-size:60px; margin:20px 0;\'>📚</h1>'">
        </div>
        <h1 style="margin: 0; font-size: 24px;">ห้องสมุดส่วนตัว</h1>
    </div>

    <div class="grid-container">
        <a href="library.html?cat=1_PetchPraUma" class="category-card"><div class="icon">🐘</div><div class="name">เพชรพระอุมา</div></a>
        <a href="library.html?cat=2_Thai_Novel" class="category-card"><div class="icon">📖</div><div class="name">นิยายไทย</div></a>
        <a href="library.html?cat=3_English_Translated" class="category-card"><div class="icon">🌍</div><div class="name">นิยายแปล</div></a>
        <a href="library.html?cat=4_Chinese_Novel" class="category-card"><div class="icon">🏮</div><div class="name">นิยายจีน</div></a>
        <a href="library.html?cat=5_HowTo_Religion" class="category-card"><div class="icon">🧠</div><div class="name">How-to / ธรรมะ</div></a>
        <a href="music_room.html" class="category-card"><div class="icon">🎵</div><div class="name">ห้องฟังเพลง</div></table></a>
        <a href="library.html?cat=8_AudioBooks" class="category-card"><div class="icon">🎧</div><div class="name">หนังสือเสียง</div></a>
        
        <a href="construction_page.html" class="category-card">
            <img src="k2-logo.jpg" alt="K2 Logo" style="width:50px; margin-bottom:10px;" onerror="this.src='https://via.placeholder.com/50'">
            <div class="name" style="color:#1877f2; font-size: 13px;">K2 Home สร้างบ้านดีต้องมีเรา</div>
        </a>

        <a href="marketplace.html" class="category-card" style="border-bottom: 5px solid #ff4757;">
            <div class="icon">🛒</div><div class="name" style="color:#ff4757;">ตลาดนัด<br>ซื้อขาย-แลกเปลี่ยน</div>
        </a>
    </div>

    <button class="btn-logout-fixed" onclick="handleSignOut()">🚪 ออกจากระบบ</button>
    <button class="btn-donate-fixed" onclick="alert('ขอบคุณที่สนับสนุนครับ!')">☕ เลี้ยงกาแฟ</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZUngq475pYOrX74lH9odnrYQI7mKw2vo",
        authDomain: "myreaderapp-89e75.firebaseapp.com",
        projectId: "myreaderapp-89e75",
        storageBucket: "myreaderapp-89e75.firebasestorage.app",
        messagingSenderId: "1016151043482",
        appId: "1:1016151043482:web:1d7e4fc51d3cab3e2c5e23"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function toggleNotiDropdown() {
        const drop = document.getElementById('notiDropdown');
        drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
    }

    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'index.html';
        } else {
            // ระบบโหลดแจ้งเตือน
            db.collection("notifications").where("recipientId", "==", user.uid).where("read", "==", false)
              .onSnapshot(snap => {
                  const badge = document.getElementById('notiBadge');
                  badge.innerText = snap.size;
                  badge.style.display = snap.size > 0 ? "block" : "none";
                  
                  const body = document.getElementById('notiBody');
                  body.innerHTML = "";
                  if (snap.empty) body.innerHTML = '<div style="padding:20px; text-align:center; color:#999;">ไม่มีการแจ้งเตือน</div>';
                  
                  snap.forEach(doc => {
                      const div = document.createElement('div');
                      div.className = "noti-item unread";
                      div.innerText = doc.data().text;
                      // ในส่วนของ div.onclick ภายใน categories.html
div.onclick = () => {
    // 1. อัปเดตลงฐานข้อมูลก่อน (Firestore จะส่ง Signal กลับมาให้ onSnapshot ทำงานใหม่)
    db.collection("notifications").doc(doc.id).update({ read: true })
      .then(() => {
          // 2. เมื่ออัปเดตสำเร็จ ให้ซ่อน dropdown ทันที
          document.getElementById('notiDropdown').style.display = 'none';
          // 3. นำทางไปหน้าตลาดนัด
          window.location.href = 'marketplace.html';
      })
      .catch((err) => {
          console.error("อัปเดตสถานะไม่สำเร็จ: ", err);
      });
};
                      body.appendChild(div);
                  });
              });
        }
    });

    function handleSignOut() {
        if (confirm("ออกจากระบบ?")) {
            localStorage.removeItem('terms_accepted');
            auth.signOut().then(() => window.location.href = 'index.html');
        }
    }
</script>
</body>
</html>
