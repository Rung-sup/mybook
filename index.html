<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="apple-touch-icon" href="https://rung-sup.github.io/mybook/app-icon.png">
    <link rel="icon" type="image/png" href="https://rung-sup.github.io/mybook/app-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Reader App</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-container {
            background-color: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center;
        }
        .title { font-size: 24px; font-weight: 600; color: #333; margin-bottom: 30px; }
        .btn-google {
            width: 100%; padding: 14px; background: #ffffff; color: #555; border: 1px solid #ddd; 
            border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500;
        }
        .btn-google:hover { background: #f8f9fa; border-color: #bbb; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="title">📚 หอสมุดส่วนตัว</div>
        <button class="btn-google" onclick="handleGoogleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            ลงชื่อเข้าใช้ด้วย Google
        </button>
    </div>

    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZUngq475pYOrX74lH9odnrYQI7mKw2vo",
        authDomain: "myreaderapp-89e75.firebaseapp.com",
        projectId: "myreaderapp-89e75",
        storageBucket: "myreaderapp-89e75.firebasestorage.app",
        messagingSenderId: "1016151043482",
        appId: "1:1016151043482:web:1d7e4fc51d3cab3e2c5e23"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // ระบบจัดการเส้นทาง: ตรวจสอบว่ายอมรับข้อตกลงหรือยัง
    // ปรับปรุงฟังก์ชันเช็คสถานะการเข้าถึง
    function checkTermsAndRedirect() {
        const hasAccepted = localStorage.getItem('terms_accepted');
        
        // ถ้ายังไม่มีสถานะการยอมรับ ให้ไปหน้า welcome เพื่อเริ่มกระบวนการ
        if (!hasAccepted) {
            window.location.href = 'welcome.html';
        } else {
            // ถ้ากดยอมรับแล้ว ให้ไปหน้าหมวดหมู่
            window.location.href = 'categories.html';
        }
    }

    // ใน onAuthStateChanged ให้เรียกฟังก์ชันนี้
    auth.onAuthStateChanged((user) => {
        if (user) {
            checkTermsAndRedirect();
        }
    });

    // ติดตามสถานะผู้ใช้
    auth.onAuthStateChanged((user) => {
        if (user) {
            // ถ้าล็อกอินแล้ว ให้ไปเช็คเงื่อนไขเพื่อส่งต่อหน้า
            checkTermsAndRedirect();
        }
    });

    // ฟังก์ชัน Google Login
    function handleGoogleLogin() {
        auth.signInWithPopup(provider)
            .catch((error) => {
                alert("เกิดข้อผิดพลาด: " + error.message);
            });
    }
    </script>
</body>
</html>
