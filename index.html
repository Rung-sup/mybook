<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="apple-touch-icon" href="https://rung-sup.github.io/mybook/app-icon.png">
    <link rel="icon" type="image/png" href="https://rung-sup.github.io/mybook/app-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Reader App</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-container {
            background-color: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center;
        }
        .title { font-size: 24px; font-weight: 600; color: #333; margin-bottom: 30px; }
        .btn-google {
            width: 100%; padding: 14px; background: #ffffff; color: #555; border: 1px solid #ddd; 
            border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500;
        }
        .btn-google:hover { background: #f8f9fa; border-color: #bbb; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="title">📚 หอสมุดส่วนตัว</div>
        <button class="btn-google" onclick="handleGoogleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            ลงชื่อเข้าใช้ด้วย Google
        </button>
    </div>

    <script>
    // 1. ตรวจสอบ LINE Browser
    const isLineApp = navigator.userAgent.indexOf('Line') > -1;
    if (isLineApp) {
        document.body.innerHTML = `
            <div style="padding: 40px; text-align: center; font-family: sans-serif; background: white; border-radius: 20px; margin: 20px;">
                <p>กรุณาเปิดแอปนี้ในเบราว์เซอร์หลัก (Safari หรือ Chrome)</p>
                <button onclick="window.location.href='https://rung-sup.github.io/mybook/index.html?openExternalBrowser=1'" 
                style="padding: 15px 30px; background: #764ba2; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer;">
                กดที่นี่เพื่อเปิดแอป
                </button>
            </div>
        `;
    }

    // 2. ตั้งค่า Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBZUngq475pYOrX74lH9odnrYQI7mKw2vo",
        authDomain: "myreaderapp-89e75.firebaseapp.com",
        projectId: "myreaderapp-89e75",
        storageBucket: "myreaderapp-89e75.firebasestorage.app",
        messagingSenderId: "1016151043482",
        appId: "1:1016151043482:web:1d7e4fc51d3cab3e2c5e23"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // 3. ระบบจัดการเส้นทาง
    function checkTermsAndRedirect() {
        const hasAccepted = localStorage.getItem('terms_accepted');
        if (!hasAccepted) {
            window.location.href = 'welcome.html';
        } else {
            window.location.href = 'categories.html';
        }
    }

    // 4. ฟังสถานะการล็อกอิน (เรียกเพียงครั้งเดียว)
    auth.onAuthStateChanged((user) => {
        if (user) {
            checkTermsAndRedirect();
        }
    });

    // 5. ฟังก์ชัน Login
    function handleGoogleLogin() {
        auth.signInWithPopup(provider)
            .catch((error) => {
                alert("เกิดข้อผิดพลาด: " + error.message);
            });
    }
    </script>
</body>
</html>
