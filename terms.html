<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อตกลงการใช้งาน - Reader App</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .terms-container { background-color: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 450px; text-align: center; }
        .app-icon { width: 140px; height: 140px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .title { font-size: 22px; font-weight: 600; color: #333; margin-bottom: 15px; }
        .terms-box { background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 10px; padding: 15px; height: 200px; overflow-y: auto; font-size: 14px; color: #555; text-align: left; margin-bottom: 20px; }
        .checkbox-container { display: flex; align-items: flex-start; margin-bottom: 20px; font-size: 13px; color: #333; text-align: left; }
        .checkbox-container input { margin-top: 2px; margin-right: 10px; cursor: pointer; width: 18px; height: 18px; }
        .btn-accept { width: 100%; padding: 12px; background: #764ba2; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .btn-accept:disabled { background: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="terms-container">
        <img src="app-icon.png" alt="App Logo" class="app-icon">
        <div class="title">📄 ข้อตกลงการใช้งาน</div>
        <div class="terms-box">
            <h4>เงื่อนไขและข้อตกลง</h4>
            <p>1. การยอมรับเงื่อนไข: การใช้งานถือว่าคุณยอมรับเงื่อนไขทั้งหมด</p>
            <p>2. ลิขสิทธิ์เนื้อหา: ห้ามคัดลอกหรือดัดแปลงผลงานโดยไม่ได้รับอนุญาต</p>
            <p>3. ข้อมูลส่วนบุคคล: เราจะจัดเก็บอีเมลเพื่อใช้ดูแลบัญชีผู้ใช้เท่านั้น</p>
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="acceptCheckbox" onchange="toggleButton()">
            <span>ฉันได้อ่านและยอมรับเงื่อนไขข้อตกลงการใช้งานทั้งหมด</span>
        </label>

        <button class="btn-accept" id="continueBtn" disabled onclick="goToCategories()">ยอมรับและเข้าสู่แอปพลิเคชัน</button>
    </div>

    <script>
        const auth = firebase.auth();
        
        // ตรวจสอบสิทธิ์: ต้องล็อกอินก่อนถึงจะเข้าหน้านี้ได้
        auth.onAuthStateChanged((user) => {
            if (!user) window.location.href = 'index.html';
            else if (localStorage.getItem('terms_accepted') === 'true') window.location.href = 'categories.html';
        });

        function toggleButton() {
            document.getElementById('continueBtn').disabled = !document.getElementById('acceptCheckbox').checked;
        }

        function goToCategories() {
            localStorage.setItem('terms_accepted', 'true');
            window.location.href = 'categories.html';
        }
    </script>
</body>
</html>
